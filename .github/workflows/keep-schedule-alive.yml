name: keep-schedule-alive

# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. One tiny commit per month keeps "keepalive"
# scheduled, so the Render service keeps getting pinged.

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-schedule-alive
  cancel-in-progress: false

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp last activity
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last-activity.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-activity.txt
          git commit -m "chore: keep scheduled workflows enabled" || exit 0
          git push
